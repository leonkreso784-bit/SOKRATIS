[workspace]
resolver = "3"
members = ["crates/sokratis-core", "crates/sokratis-io", "crates/sokratis-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Leon Kreso"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
tempfile = "3"
